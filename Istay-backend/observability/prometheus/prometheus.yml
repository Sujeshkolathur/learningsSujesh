global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: istay-backend
    metrics_path: /actuator/prometheus
    static_configs:
      # App runs on the host (mvn spring-boot:run), not inside Compose
      - targets: ["host.docker.internal:8080"]
        labels:
          application: istay-backend
          env: local
