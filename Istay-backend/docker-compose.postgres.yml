# Local PostgreSQL for istay-backend
# Usage: docker compose -f docker-compose.postgres.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: istay-postgres
    environment:
      POSTGRES_DB: istay
      POSTGRES_USER: istay
      POSTGRES_PASSWORD: istay
    ports:
      - "5432:5432"
    volumes:
      - istay-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U istay -d istay"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  istay-postgres-data:
