spring:
  application:
    name: istay-backend
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: ${spring.application.name}
    description: iStay hospitality booking API

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

istay:
  cors:
    allowed-origins: ${ISTAY_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    actuator-open: false
    open-api-enabled: false
    jwt:
      secret: ${ISTAY_JWT_SECRET:}
      expiration-minutes: ${ISTAY_JWT_EXPIRATION_MINUTES:480}
