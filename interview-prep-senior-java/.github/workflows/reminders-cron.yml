# Free scheduler for cloud deploy (Render/Railway sleep when idle).
# Set repository secrets: APP_BASE_URL, PREP_API_SECRET
name: Interview prep reminders (IST)

on:
  schedule:
    # Runs at :30 UTC → :00 IST (7:00–22:00 IST window for hours 1–16 UTC)
    - cron: "30 1-16 * * *"
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Send reminders based on IST hour
        env:
          BASE_URL: ${{ secrets.APP_BASE_URL }}
          API_KEY: ${{ secrets.PREP_API_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_URL" ] || [ -z "$API_KEY" ]; then
            echo "Set secrets APP_BASE_URL and PREP_API_SECRET"
            exit 1
          fi
          IST_HOUR=$(TZ=Asia/Kolkata date +%H)
          echo "IST hour: $IST_HOUR"

          if [ "$IST_HOUR" = "07" ]; then
            curl -fsS "$BASE_URL/api/reminders/send?slot=MORNING&key=$API_KEY"
          fi
          if [ "$IST_HOUR" = "20" ]; then
            curl -fsS "$BASE_URL/api/reminders/send?slot=EVENING&key=$API_KEY"
          fi
          if [ "$IST_HOUR" -ge 7 ] && [ "$IST_HOUR" -le 22 ]; then
            curl -fsS "$BASE_URL/api/reminders/hourly/send?key=$API_KEY"
          fi
